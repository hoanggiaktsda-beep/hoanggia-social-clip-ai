name: Deploy HOANGGIA Social Clip Web V1.2
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
      - name: Validate web assets
        shell: bash
        run: |
          test -s index.html
          test -s editor-v12.js
          test -s icon.svg
          test -s manifest.webmanifest
          grep -q 'editor-v12.js' index.html
          mkdir -p _site
          cp index.html editor-v12.js icon.svg manifest.webmanifest _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
