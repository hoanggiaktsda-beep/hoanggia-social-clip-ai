name: Motion Analyzer CI
on:
  push:
    branches: [feature/video-recreator-motion-v1]
  pull_request:
    paths: ['recreator/**', '.github/workflows/motion-analyzer-ci.yml']
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and unit tests
        run: |
          python -m compileall -q recreator
          python -m unittest discover -s recreator/tests -v
  browser-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone preview
        run: |
          node --check motion-preview/session-store.js
          grep -q 'sessionList' motion-preview/index.html
          grep -q 'selectSession' motion-preview/motion-preview.js
          node --check motion-preview/motion-preview.js
          node --check motion-preview/motion-sampling.js
          node --check motion-preview/motion-reconstruction.js
          node motion-preview/tests/motion-sampling.test.mjs
          node --check motion-preview/video-prompt.js
          node motion-preview/tests/video-prompt.test.mjs
          grep -q 'masterPrompt' motion-preview/index.html
          python - <<'PY'
          from pathlib import Path
          html=Path('motion-preview/index.html').read_text()
          assert html.index('id="viewer"') < html.index('id="advanced"'), 'Video player must remain visible outside advanced panel'
          assert html.index('id="viewer"') < html.index('id="masterPrompt"'), 'Video must precede prompt output'
          PY
          node --check motion-preview/facial-metrics.js
          node motion-preview/tests/facial-metrics.test.mjs
          node --check motion-preview/motion-quality.js
          node motion-preview/tests/motion-quality.test.mjs
          node --check motion-preview/transfer-package.js
          node motion-preview/tests/transfer-package.test.mjs
          node --check motion-preview/hand-quality.js
          node --check motion-preview/quality-review.js
          node motion-preview/tests/quality-review.test.mjs
          test -s motion-preview/index.html
          test -s assets/logo.svg
          grep -q 'motion-preview.js' motion-preview/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: motion-preview-v1-1
          path: |
            motion-preview/
            assets/logo.svg
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r recreator/requirements.txt
      - name: Generate synthetic video and analyze
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=160x90:r=10:d=2 -y /tmp/motion-test.mp4
          python -m recreator.motion_analyzer /tmp/motion-test.mp4 --out /tmp/motion-result --sample-fps 5 --no-pose
          python -c "import json,pathlib; p=pathlib.Path('/tmp/motion-result'); d=json.loads((p/'motion.json').read_text()); assert len(d['frames'])>=8; assert (p/'motion_overlay.mp4').stat().st_size>0; assert len(d['scenes'])>=1"
